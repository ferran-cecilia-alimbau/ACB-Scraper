[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acb-scraper"
version = "0.1.0"
description = "Descarga cruda (JSON) de la API de la ACB: partidos, play-by-play, tiros, clasificaciones, plantillas y fichas."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
build = ["pyarrow>=15"]
dev = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
acb-scraper = "acb_scraper.__main__:entrypoint"

[tool.setuptools]
packages = ["acb_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
